name: Build ZegaAI APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP dosyasi bulunamadi"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          ROOT=$(find extracted -name settings.gradle.kts -print -quit | xargs dirname)
          if [ -z "$ROOT" ]; then
            echo "Gradle projesi bulunamadi"
            exit 1
          fi
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZegaAI-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
