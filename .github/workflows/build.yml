name: ZegaAI APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Extract ZIP if needed
        run: |
          if ! find . -name settings.gradle.kts -not -path './.git/*' | grep -q .; then
            ZIP=$(find . -maxdepth 2 -name '*.zip' -print -quit)
            if [ -z "$ZIP" ]; then
              echo "Source ZIP not found"
              exit 1
            fi
            mkdir -p source_files
            unzip -q "$ZIP" -d source_files
          fi

      - name: Find Android project
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path './.git/*' -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile ZegaAI
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZegaAI-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
